<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Asociación Italiani a Siviglia</title>
<link rel="canonical" href="https://italianiasiviglia.com/es/">
<link rel="alternate" hreflang="es" href="https://italianiasiviglia.com/es/">
<link rel="alternate" hreflang="it" href="https://italianiasiviglia.com/it/">
<link rel="alternate" hreflang="x-default" href="https://italianiasiviglia.com/es/">
<meta http-equiv="refresh" content="0; url=/es/">
<script>
  // Prefer the visitor's language when we have a page for it; the meta
  // refresh above is the no-JS fallback and always lands on Spanish.
  var l = (navigator.language || 'es').slice(0, 2);
  location.replace(l === 'it' ? '/it/' : '/es/');
</script>
</head>
<body>
<p>Redirigiendo a <a href="/es/">/es/</a> · <a href="/it/">Italiano</a></p>
</body>
</html>
