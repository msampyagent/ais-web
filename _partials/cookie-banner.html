<!-- Cookie banner — extracted from AIS Navegacion.dc.html.
     Refusal is the default: nothing is set until a choice is made, and
     "Rechazar" and "Aceptar" are the same button in the same weight.
     Do not promote Accept to a filled button. -->
<div class="cookie-banner" id="cookie-banner" hidden
     role="dialog" aria-modal="false" aria-labelledby="cookie-banner-title">
  <div class="cookie-banner__inner">
    <div style="flex:1">
      <p class="cookie-banner__title" id="cookie-banner-title">{{cookieTitle}}</p>
      <p class="cookie-banner__text">{{cookieText}}</p>
    </div>
    <div class="cookie-banner__actions">
      <button class="btn btn--secondary" type="button" data-cookie="reject">{{cookieReject}}</button>
      <button class="btn btn--secondary" type="button" data-cookie="accept">{{cookieAccept}}</button>
      <a class="btn btn--ghost btn--ghost-ruled" href="{{cookiePolicyHref}}">{{cookiePrefs}}</a>
    </div>
  </div>
</div>
